name: Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

# Required permissions for test result publishing
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kotlin:
              - '**'
              - '!.github/workflows/**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
            ios:
              - '**'
              - '!composeApp/**'
              - '!designsystem/**'
              - '!**/androidMain/**'
              - '!.github/workflows/**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'

  kotlin-tests:
    name: Run Kotlin Tests
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      SENTRY_DNS: ${{ secrets.SENTRY_DNS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2 #TODO: Beware of version bump; it breaks the workflow
        with:
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Common Unit Tests
        run: ./gradlew testDebugUnitTest -PexcludeTests="**/*IntegrationTest*" --continue

      - name: Upload Kotlin Test Results
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail
        with:
          name: kotlin-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 30

      - name: Publish Kotlin Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/build/test-results/**/*.xml
          check_name: "Kotlin Test Results"
          comment_title: "Kotlin Test Results"
          fail_on: "test failures"

      - name: Comment PR with Kotlin Test Results
        uses: dorny/test-reporter@v2
        if: always() && github.event_name == 'pull_request'
        with:
          name: 'Kotlin Tests (Common + Android)'
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: false

  # iOS tests
  ios-tests:
    name: Run iOS Tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      SENTRY_DNS: ${{ secrets.SENTRY_DNS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2 #TODO: Beware of version bump; it breaks the workflow

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run iOS Unit Tests
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Upload iOS Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            **/build/test-results/iosSimulatorArm64Test/**/*.xml
            **/build/reports/tests/iosSimulatorArm64Test/**
          retention-days: 30

      - name: Comment PR with iOS Test Results
        uses: dorny/test-reporter@v2
        if: always() && github.event_name == 'pull_request'
        with:
          name: 'iOS Tests'
          path: '**/build/test-results/iosSimulatorArm64Test/**/*.xml'
          reporter: java-junit
          fail-on-error: false

  # Test summary job
  test-summary:
    name: Unified Test Summary
    runs-on: ubuntu-latest
    needs: [changes, kotlin-tests, ios-tests]
    if: always()

    steps:
      - name: Download Kotlin Test Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kotlin-test-results
          path: kotlin-test-results

      - name: Download iOS Test Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-test-results
          path: ios-test-results

      - name: Generate Unified Test Summary
        env:
          KOTLIN_RELEVANT: ${{ needs.changes.outputs.kotlin }}
          IOS_RELEVANT: ${{ needs.changes.outputs.ios }}
          KOTLIN_RESULT: ${{ needs.kotlin-tests.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
        run: |
          echo "## 🧪 Multi-Platform Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Path | Ran? | Result | Test files |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|------------|" >> $GITHUB_STEP_SUMMARY

          # Kotlin row
          KOTLIN_TEST_FILES=$(find kotlin-test-results -name "*.xml" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$KOTLIN_RELEVANT" = "true" ]; then
            case "$KOTLIN_RESULT" in
              success) KOTLIN_ICON="✅" ;;
              failure) KOTLIN_ICON="❌" ;;
              *) KOTLIN_ICON="⚠️ ($KOTLIN_RESULT)" ;;
            esac
            echo "| Kotlin (Common + Android) | Yes | $KOTLIN_ICON | $KOTLIN_TEST_FILES |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Kotlin (Common + Android) | Skipped — no relevant changes | — | — |" >> $GITHUB_STEP_SUMMARY
          fi

          # iOS row
          IOS_TEST_FILES=$(find ios-test-results -name "*.xml" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IOS_RELEVANT" = "true" ]; then
            case "$IOS_RESULT" in
              success) IOS_ICON="✅" ;;
              failure) IOS_ICON="❌" ;;
              *) IOS_ICON="⚠️ ($IOS_RESULT)" ;;
            esac
            echo "| iOS | Yes | $IOS_ICON | $IOS_TEST_FILES |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| iOS | Skipped — no relevant changes | — | — |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL_TEST_FILES=$((KOTLIN_TEST_FILES + IOS_TEST_FILES))
          echo "**Combined test files executed:** $TOTAL_TEST_FILES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📋 All artifacts retained for 30 days" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check individual test result actions for detailed breakdowns" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Note:** Full test coverage is available via Codecov on the integration-tests workflow" >> $GITHUB_STEP_SUMMARY